name: SimitKulesi
options:
  bundleIdPrefix: com.tiyzi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SimitKulesi:
    type: application
    platform: iOS
    sources:
      - SimitKulesi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiyzi.simitkulesi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SimitKulesi/Info.plist
      properties:
        CFBundleDisplayName: Simit Kulesi
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
