name: Simit Kulesi IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['SimitKulesi/**', '.github/workflows/simit.yml']

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: SimitKulesi
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur ve projeyi oluştur
        run: |
          brew install xcodegen
          xcodegen

      - name: İmzasız derle
        run: |
          xcodebuild -project SimitKulesi.xcodeproj -target SimitKulesi \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SimitKulesi.app Payload/
          zip -qr SimitKulesi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SimitKulesi-ipa
          path: SimitKulesi/SimitKulesi.ipa
