name: Altın Vuruş IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['AltinVurus/**', '.github/workflows/altin.yml']

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: AltinVurus
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur ve projeyi oluştur
        run: |
          brew install xcodegen
          xcodegen

      - name: İmzasız derle
        run: |
          xcodebuild -project AltinVurus.xcodeproj -target AltinVurus \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/AltinVurus.app Payload/
          zip -qr AltinVurus.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AltinVurus-ipa
          path: AltinVurus/AltinVurus.ipa
